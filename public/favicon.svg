<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Ornate Decorative Golden Dashed Border -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#6ee7b7" stroke-width="0.8" stroke-dasharray="2.5 2" opacity="0.5"/>

  <!-- Outer Golden Medallion Coin -->
  <circle cx="32" cy="32" r="21" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Inner Emerald Core of the Coin -->
  <circle cx="32" cy="32" r="18" fill="#047857" stroke="#fbbf24" stroke-width="1"/>

  <!-- Iconic Taka Sign ৳ in Gleaming Gold -->
  <text x="32" y="42.5" font-family="'Hind Siliguri', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#goldInner)" text-anchor="middle" filter="url(#shadow)">৳</text>

  <!-- Sparkle Accents (Authentication & Gold Quality) -->
  <path d="M47 15 L48.5 18.5 L52 20 L48.5 21.5 L47 25 L45.5 21.5 L42 20 L45.5 18.5 Z" fill="#fbbf24" opacity="0.95"/>
  <circle cx="15" cy="18" r="1.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="49" cy="47" r="1.2" fill="#fef08a" opacity="0.85"/>
</svg>